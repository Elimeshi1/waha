name: Build & push WAHA (GOWS + NOWEB, amd64)

# Builds the two images the user cares about and pushes them to Docker Hub:
#   <user>/waha-gows   - GOWS engine (whatsmeow), with our patched status.go
#   <user>/waha-noweb  - NOWEB engine (Baileys)
# amd64 only. Native on GitHub's amd64 runners (no QEMU). Both images are built
# from Dockerfile.gows-local with our locally-built gows binary (unused at runtime
# by NOWEB, but harmless and keeps a single build path).
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  - your Docker Hub username
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings > Security)

on:
  push:
    branches: [core]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (waha)
        uses: actions/checkout@v4

      - name: Read WAHA version
        id: ver
        # package.json is a placeholder (0.0.1); the real version lives in src/version.ts
        run: |
          v=$(grep -oP "version: '\K[0-9]+\.[0-9]+\.[0-9]+" src/version.ts | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "WAHA version: $v"

      - name: Build patched gows binary (from Elimeshi1/gows-plus)
        run: |
          git clone --depth 1 https://github.com/Elimeshi1/gows-plus.git /tmp/gows-plus
          docker build -t gows-builder /tmp/gows-plus
          cid=$(docker create gows-builder)
          mkdir -p .gows
          docker cp "$cid:/release/gows" .gows/gows-amd64
          docker rm -f "$cid"
          chmod +x .gows/gows-amd64
          file .gows/gows-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push GOWS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gows-local
          platforms: linux/amd64
          push: true
          build-args: |
            WHATSAPP_DEFAULT_ENGINE=GOWS
            USE_BROWSER=none
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/waha-gows:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/waha-gows:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push NOWEB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gows-local
          platforms: linux/amd64
          push: true
          build-args: |
            WHATSAPP_DEFAULT_ENGINE=NOWEB
            USE_BROWSER=none
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/waha-noweb:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/waha-noweb:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
